name: Validate AJACKTI Agent Harness

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate-offline:
    name: Stdlib Python Offline Validation & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python stdlib
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate harness registry, profiles, templates, and Markdown links
        run: python3 -B scripts/harness.py validate

      - name: Run offline unit test suite
        run: python3 -B -m unittest discover -s tests -v
